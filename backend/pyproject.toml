[project]
name = "dartscounter-backend"
version = "0.1.0"
description = "DartsCounter FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Volontairement étroit : erreurs de syntaxe (E9), pyflakes (F) et les règles
# de style qui signalent un vrai risque de lecture (E4 imports, E7 dont E741
# « nom de variable ambigu »). Élargir quand la base sera assainie — pas avant,
# sinon la porte CI arrive rouge et personne ne la respecte.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Les migrations sont générées par `alembic revision --autogenerate`, qui laisse
# régulièrement un `import sqlalchemy as sa` non utilisé. Les corriger à la main
# à chaque génération n'apporte rien.
"app/migrations/versions/*" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the global SQLAlchemy engine (and
# its pooled asyncpg connections) is created once at import time, and
# asyncpg connections can't be reused across different event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
